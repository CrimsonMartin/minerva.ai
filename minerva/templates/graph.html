<title>__TITLE__</title>
<style>
  :root {
    --surface: #fcfcfb; --panel: #f4f3f0; --ink: #0b0b0b; --ink-2: #52514e;
    --ink-3: #8a887f; --line: #e2e0da; --accent: #4a3aa7;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s0:#9a988e;
    --edge: 226,224,218; --halo: 252,252,251;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #17181a; --panel: #1f2124; --ink: #f2f1ec; --ink-2: #b9b8af;
      --ink-3: #7c7b73; --line: #2e3034; --accent: #9085e9;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#3fa23f; --s7:#9085e9; --s8:#e66767; --s0:#6f6e66;
      --edge: 46,48,52; --halo: 23,24,26;
    }
  }
  :root[data-theme="dark"] {
    --surface: #17181a; --panel: #1f2124; --ink: #f2f1ec; --ink-2: #b9b8af;
    --ink-3: #7c7b73; --line: #2e3034; --accent: #9085e9;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#3fa23f; --s7:#9085e9; --s8:#e66767; --s0:#6f6e66;
    --edge: 46,48,52; --halo: 23,24,26;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--surface); color: var(--ink); overflow: hidden;
    font: 14px/1.45 system-ui, sans-serif;
  }
  #canvas { position: fixed; inset: 0; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  .hud { position: fixed; z-index: 3; }
  #header { top: 0; left: 0; right: 0; padding: 14px 20px 28px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    background: linear-gradient(rgb(var(--halo)) 30%, rgba(var(--halo),0));
    pointer-events: none; }
  #header > * { pointer-events: auto; }
  h1 { font: 600 21px/1.2 "Iowan Old Style", Georgia, "Times New Roman", serif;
    letter-spacing: .01em; text-wrap: balance; }
  #stats { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  #stats b { color: var(--ink); font-weight: 600; }
  #searchbox { margin-left: auto; display: flex; flex-direction: column;
    align-items: flex-end; gap: 3px; }
  #search-note { font-size: 11.5px; color: var(--ink-3); min-height: 14px;
    padding-right: 2px; }
  #search-note[data-kind="ok"] { color: var(--accent); }
  #search-note[data-kind="warn"] { color: var(--s2); }
  #search { background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px;
    width: min(300px, 70vw); font: inherit; }
  #search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #legend { left: 16px; bottom: 14px; display: flex; flex-direction: column;
    gap: 4px; max-width: 250px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    border: 1px solid transparent; border-radius: 999px; cursor: pointer;
    background: none; color: var(--ink-2); font: 12.5px system-ui, sans-serif;
    text-align: left; }
  .chip:hover { background: var(--panel); }
  .chip:focus-visible { outline: 2px solid var(--accent); }
  .chip.off { opacity: .38; }
  .chip.solo { background: var(--panel); border-color: var(--line); color: var(--ink); }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .chip .n { margin-left: auto; color: var(--ink-3);
    font-variant-numeric: tabular-nums; }
  #edgekey { right: 16px; bottom: 14px; color: var(--ink-3); font-size: 12px;
    display: flex; gap: 10px; align-items: center; }
  #edgekey .chip { color: inherit; gap: 6px; }
  #edgekey svg { vertical-align: -3px; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw);
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 20px; overflow-y: auto; transform: translateX(105%);
    transition: transform .22s ease; z-index: 4; }
  @media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
  #panel.open { transform: none; }
  #panel .close { float: right; background: none; border: 0; color: var(--ink-3);
    font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px; }
  #panel .close:hover { color: var(--ink); }
  #panel h2 { font: 600 16px/1.35 system-ui, sans-serif; margin: 4px 0 12px;
    text-wrap: balance; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 6px;
    align-items: center; }
  #panel h3 { font: 600 11px/1 system-ui, sans-serif; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-3); margin: 16px 0 8px; }
  .rel { display: block; width: 100%; text-align: left; background: none;
    border: 0; border-top: 1px solid var(--line); padding: 8px 2px;
    color: var(--ink); cursor: pointer; font: 13px/1.4 system-ui, sans-serif; }
  .rel:hover { color: var(--accent); }
  .rel .kind { color: var(--ink-3); font-size: 11px;
    font-family: ui-monospace, monospace; }
  a.rel { text-decoration: none; }
  a.rel:hover { color: var(--accent); text-decoration: underline; }
  a.rel:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rel .sub { display: block; color: var(--ink-3); font-size: 11.5px;
    margin-top: 2px; }
  #tip { position: fixed; z-index: 5; pointer-events: none; max-width: 320px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 1.4;
    box-shadow: 0 4px 18px rgba(0,0,0,.18); display: none; }
  #tip .d { color: var(--ink-3); font-size: 11px; margin-top: 3px; }
</style>

<canvas id="canvas"></canvas>

<div class="hud" id="header">
  <h1>__TITLE__</h1>
  <span id="stats"></span>
  <span id="searchbox">
    <input id="search" type="search" placeholder="Search ideas…"
           aria-label="Search idea statements">
    <span id="search-note" role="status"></span>
  </span>
</div>

<div class="hud" id="legend" role="group" aria-label="Domains — click to isolate"></div>

<div class="hud" id="edgekey">
  <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3"
    stroke="currentColor" stroke-width="1.6"/></svg> part_of</span>
  <button class="chip" id="toggle-related"><svg width="26" height="6"><line x1="0" y1="3"
    x2="26" y2="3" stroke="currentColor" stroke-width="1"/></svg> related_to</button>
  <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3"
    stroke="currentColor" stroke-width="1.8" stroke-dasharray="4 3"/></svg> analogous_to</span>
</div>

<aside id="panel" aria-label="Idea details">
  <button class="close" aria-label="Close details">×</button>
  <div id="panel-body"></div>
</aside>

<div id="tip" role="status"></div>

<script>
const DATA = __DATA__;

// ---- domain → color slot (fixed order by size; the rest fold to "other") ----
const counts = {};
DATA.nodes.forEach(n => counts[n.domain] = (counts[n.domain] || 0) + 1);
const TOP = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8)
  .map(e => e[0]);
const slotOf = d => { const i = TOP.indexOf(d); return i < 0 ? 0 : i + 1; };

// ---- domain anchors: ring slots, biggest domain in the middle, so same-hue
// ideas settle into a readable region instead of dispersing ----
const ringDomains = TOP.slice(1).concat(['__other__']);
const anchors = new Map([[TOP[0] ?? '__other__', { x: 0, y: 0 }]]);
ringDomains.forEach((d, i) => {
  const a = (i / ringDomains.length) * Math.PI * 2 - Math.PI / 2;
  anchors.set(d, { x: Math.cos(a) * 620, y: Math.sin(a) * 620 });
});
const domainCenter = d =>
  anchors.get(d) ?? anchors.get('__other__') ?? { x: 0, y: 0 };

const css = name => getComputedStyle(document.documentElement)
  .getPropertyValue(name).trim();
let C = {};
function readTheme() {
  C = { surface: css('--surface'), ink: css('--ink'), ink2: css('--ink-2'),
        ink3: css('--ink-3'), edge: css('--edge'), accent: css('--accent'),
        s: [css('--s0'), css('--s1'), css('--s2'), css('--s3'), css('--s4'),
            css('--s5'), css('--s6'), css('--s7'), css('--s8')] };
}
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  readTheme(); draw();
});

// ---- graph model ----
const nodes = DATA.nodes.map(n => ({ ...n, x: 0, y: 0, vx: 0, vy: 0, deg: 0 }));
const byId = new Map(nodes.map(n => [n.id, n]));
const seen = new Set();
const edges = [];
for (const e of DATA.edges) {
  const a = byId.get(e.source), b = byId.get(e.target);
  if (!a || !b) continue;
  const key = [e.source, e.target].sort().join('|');   // mirrored edges: keep one,
  if (seen.has(key) && e.rel === 'related_to') continue; // prefer the typed one
  if (!seen.has(key)) { a.deg++; b.deg++; }
  seen.add(key);
  edges.push({ a, b, rel: e.rel });
}
nodes.forEach(n => {
  n.r = 3.5 + Math.sqrt(n.deg) * 1.6 + (n.papers > 1 ? 2 : 0);
  const c = domainCenter(slotOf(n.domain) === 0 ? '__other__' : n.domain);
  const a = Math.random() * Math.PI * 2, rad = Math.random() * 160;
  n.x = c.x + Math.cos(a) * rad; n.y = c.y + Math.sin(a) * rad;
});
document.getElementById('stats').innerHTML =
  `<b>${nodes.length}</b> ideas · <b>${edges.length}</b> links · ${
    DATA.paperCount} papers`;

// ---- force simulation ----
// Declared here, not with the other pointer state below: tick() reads it and
// runs during warm-up, before that block would be initialized.
let dragNode = null;
function tick(alpha) {
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const m = nodes[j];
      let dx = n.x - m.x, dy = n.y - m.y;
      let d2 = dx * dx + dy * dy;
      if (d2 > 40000) continue;
      if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const f = alpha * 320 / d2;
      dx *= f; dy *= f;
      n.vx += dx; n.vy += dy; m.vx -= dx; m.vy -= dy;
    }
  }
  for (const e of edges) {
    // Structural edges pull hard (they make the clusters); the loose
    // related_to mesh pulls weakly so it doesn't homogenize the layout.
    const k = e.rel === 'part_of' ? .08 : e.rel === 'analogous_to' ? .05 : .02;
    const rest = e.rel === 'related_to' ? 90 : 45;
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = alpha * k * (d - rest) / d / (1 + Math.min(e.a.deg, e.b.deg) * .05);
    e.a.vx += dx * f; e.a.vy += dy * f;
    e.b.vx -= dx * f; e.b.vy -= dy * f;
  }
  // Domain gravity: each domain has a slot on a ring, so same-colored ideas
  // settle into a readable region instead of dispersing through the whole field.
  for (const n of nodes) {
    const c = domainCenter(n.domain);
    n.vx += (c.x - n.x) * alpha * .07; n.vy += (c.y - n.y) * alpha * .07;
  }
  for (const n of nodes) {
    n.vx -= n.x * alpha * .006; n.vy -= n.y * alpha * .006;  // center gravity
    // Clamp the step: explicit Euler with stiff springs diverges otherwise.
    const speed = Math.hypot(n.vx, n.vy);
    if (speed > 18) { n.vx *= 18 / speed; n.vy *= 18 / speed; }
    if (n !== dragNode) { n.x += n.vx; n.y += n.vy; }
    n.vx *= .6; n.vy *= .6;
  }
}
for (let i = 0; i < 600; i++) tick(Math.max(.05, .35 * (1 - i / 600)));  // settle

// ---- rendering ----
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel');   // needed by draw(), which the
                                                  // render loop calls immediately
let view = { x: 0, y: 0, k: 1 }, dpr = 1;
function resize() {
  dpr = devicePixelRatio || 1;
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  fitView();
  draw();
}
// Width the panel covers — the canvas keeps drawing under it, so framing and
// labels must stay clear of that strip.
const panelW = () =>
  panel.classList.contains('open') ? Math.min(360, innerWidth * .92) : 0;

/** View that frames `set`, clamped so a lone node doesn't zoom absurdly. */
function viewFor(set, minK, maxK) {
  const pad = { l: 34, r: 34 + panelW(), t: 66, b: 54 };
  const finite = set.filter(n => isFinite(n.x) && isFinite(n.y));
  if (!finite.length) return { x: innerWidth / 2, y: innerHeight / 2, k: 1 };
  const xs = finite.map(n => n.x), ys = finite.map(n => n.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const w = innerWidth - pad.l - pad.r, h = innerHeight - pad.t - pad.b;
  const k = Math.min(maxK, Math.max(minK,
    Math.min(w / Math.max(x1 - x0, 1), h / Math.max(y1 - y0, 1)) * .88));
  return { k, x: pad.l + w / 2 - (x0 + x1) / 2 * k,
           y: pad.t + h / 2 - (y0 + y1) / 2 * k };
}
function fitView() { view = viewFor(nodes, .15, 6); }

/** Ease the view to `target` (instant when reduced motion is preferred). */
let anim = null;
function glideTo(target) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { view = target; draw(); return; }
  const from = { ...view }, t0 = performance.now(), dur = 420;
  if (anim) cancelAnimationFrame(anim);
  (function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    const e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;  // ease
    view = { x: from.x + (target.x - from.x) * e,
             y: from.y + (target.y - from.y) * e,
             k: from.k + (target.k - from.k) * e };
    draw();
    if (p < 1) anim = requestAnimationFrame(step);
  })(t0);
}

/** Frame a node together with everything it links to. */
function focusNode(n) {
  const set = [n, ...neighbors.get(n)];
  glideTo(viewFor(set, .35, 1.9));
}
let selected = null, hovered = null, soloDomain = null, query = '';
let labelHits = [];   // screen-space boxes of the drawn labels, for hit-testing
let semantic = null;  // Map(node -> similarity) when a semantic search is live

// ---- embedding search ----------------------------------------------------
// Idea vectors ride along in the page (unit-normalized int8), so ranking is a
// dot product here. Only the *query* needs the model, so the page asks the
// configured endpoint for it; anything missing or unreachable falls back to
// plain text matching, which always works offline.
const VEC = (() => {
  const v = DATA.vectors;
  if (!v) return null;
  const bin = atob(v.data);
  const buf = new Int8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = (bin.charCodeAt(i) << 24) >> 24;
  return { dims: v.dims, buf, model: v.model };
})();

function scoreAgainst(qvec) {
  const { dims, buf } = VEC;
  const scores = new Map();
  for (let i = 0; i < nodes.length; i++) {
    let dot = 0;
    const off = i * dims;
    for (let d = 0; d < dims; d++) dot += qvec[d] * buf[off + d];
    scores.set(nodes[i], dot / 127);
  }
  return scores;
}

// The query is embedded in the browser by the same small model that produced
// the vectors above (all-MiniLM-L6-v2, ~23 MB, cached by the browser after
// the first search). WebGPU when available, WASM otherwise. No server.
let embedder = null, embedderFailed = false;
async function getEmbedder(onStatus) {
  if (embedder || embedderFailed) return embedder;
  onStatus?.('loading search model (first time only)…');
  try {
    const { pipeline, env } = await import(
      'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
    env.allowLocalModels = false;
    // dtype is not a free choice: q8 weights produce garbage vectors on the
    // WebGPU backend (measured cosine ~0 against the same model's known
    // output), so WebGPU takes fp32 and only the CPU path uses the small
    // quantized weights.
    const device = navigator.gpu ? 'webgpu' : 'wasm';
    const dtype = device === 'webgpu' ? 'fp32' : 'q8';
    embedder = await pipeline('feature-extraction', DATA.searchModel,
                              { device, dtype });
    embedder.device = `${device}/${dtype}`;
  } catch (err) {
    embedderFailed = true;                 // offline / no CDN / unsupported
    throw err;
  }
  return embedder;
}

async function embedQuery(text, onStatus) {
  if (!VEC) return null;
  const pipe = await getEmbedder(onStatus);
  const out = await pipe(text, { pooling: 'mean', normalize: true });
  const raw = Array.from(out.data);
  if (raw.length !== VEC.dims) throw new Error('embedding size mismatch');
  return Float32Array.from(raw);
}
let showRelated = false;   // the loose related_to mesh is opt-in: it is 2/3 of
                           // the edges and obscures the structural ones
const SEMANTIC_KEEP = 25;      // how many ideas a semantic query surfaces
const visible = n => {
  const domOK = !soloDomain ||
    (soloDomain === '__other__' ? slotOf(n.domain) === 0 : n.domain === soloDomain);
  if (!domOK) return false;
  if (!query) return true;
  if (semantic) return semantic.has(n);
  return n.statement.toLowerCase().includes(query);
};
function emphasis(n) {
  if (!visible(n)) return .12;
  if (selected) {
    if (n === selected) return 1;
    return neighbors.get(selected).has(n) ? .95 : .15;
  }
  return query || soloDomain ? 1 : .9;
}
const neighbors = new Map(nodes.map(n => [n, new Set()]));
edges.forEach(e => { neighbors.get(e.a).add(e.b); neighbors.get(e.b).add(e.a); });

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.translate(view.x, view.y); ctx.scale(view.k, view.k);
  for (const e of edges) {
    const em = Math.min(emphasis(e.a), emphasis(e.b));
    const strong = selected && (e.a === selected || e.b === selected);
    if (e.rel === 'related_to' && !showRelated && !strong) continue;
    let alpha = e.rel === 'related_to' ? .35 : .6;
    alpha *= em; if (strong) alpha = .95;
    ctx.strokeStyle = strong ? C.accent : `rgba(${C.edge},${alpha + .25})`;
    ctx.globalAlpha = strong ? .9 : Math.max(.06, em * .8);
    ctx.lineWidth = (e.rel === 'related_to' ? .7 : 1.3) / view.k +
      (strong ? .8 / view.k : 0);
    ctx.setLineDash(e.rel === 'analogous_to' ? [5 / view.k, 4 / view.k] : []);
    ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const n of nodes) {
    const em = emphasis(n);
    ctx.globalAlpha = em;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7);
    ctx.fillStyle = C.s[slotOf(n.domain)];
    ctx.fill();
    if (n === selected || n === hovered) {
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6 / view.k; ctx.stroke();
    } else {
      ctx.strokeStyle = C.surface; ctx.lineWidth = 1 / view.k; ctx.stroke();
    }
  }
  // Labels in screen space (so they stay legible at any zoom) with simple
  // collision rejection — a label is drawn only where it doesn't overlap one
  // already placed, which keeps a dense graph readable.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = '600 11.5px system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  const placed = [];
  labelHits = [];   // rebuilt every frame so the text itself is clickable
  // With a selection, label that neighbourhood (and give it room for longer
  // text) instead of the busiest nodes globally — that is what you're reading.
  const focus = selected ? [selected, ...neighbors.get(selected)] : null;
  const cands = focus
    ? focus.slice().sort((a, b) => (a === selected ? -1 : b === selected ? 1 : b.deg - a.deg))
    : [...nodes].sort((a, b) => b.deg - a.deg);
  const maxLabels = focus ? 18 : 22;
  const maxChars = focus ? 64 : 34;
  const rightEdge = innerWidth - panelW() - 12;
  let drawn = 0;
  for (const n of cands) {
    if (drawn >= maxLabels) break;
    if (emphasis(n) < .5) continue;
    const sx = n.x * view.k + view.x, sy = n.y * view.k + view.y;
    if (sx < 40 || sx > rightEdge - 40 || sy < 54 || sy > innerHeight - 48) continue;
    const text = n.statement.length > maxChars
      ? n.statement.slice(0, maxChars).trimEnd() + '…' : n.statement;
    const w = ctx.measureText(text).width;
    const x = sx + n.r * view.k + 5, y = sy;
    const box = { x0: x - 2, y0: y - 8, x1: x + w + 2, y1: y + 8 };
    if (placed.some(p => box.x0 < p.x1 && box.x1 > p.x0 &&
                         box.y0 < p.y1 && box.y1 > p.y0)) continue;
    if (x + w > rightEdge) continue;       // never run under the detail panel
    placed.push(box);
    labelHits.push({ node: n, box });
    drawn++;
    ctx.globalAlpha = 1;
    ctx.font = n === selected
      ? '600 13px system-ui, sans-serif' : '600 11.5px system-ui, sans-serif';
    ctx.strokeStyle = C.surface; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
    ctx.strokeText(text, x, y);            // halo so type survives over edges
    ctx.fillStyle = n === selected ? C.accent : C.ink;
    ctx.fillText(text, x, y);
  }
}

let running = 120;
(function loop() {
  if (running > 0) { tick(Math.min(.25, running / 500)); running--; draw(); }
  requestAnimationFrame(loop);
})();
const wake = n => { running = Math.max(running, n); };

// ---- interaction ----
const toWorld = (px, py) =>
  ({ x: (px - view.x) / view.k, y: (py - view.y) / view.k });
function hit(px, py) {
  // Labels first: the text is a far bigger target than the dot, and anything
  // labelled is what you're most likely aiming at.
  for (const l of labelHits) {
    if (px >= l.box.x0 - 3 && px <= l.box.x1 + 3 &&
        py >= l.box.y0 - 3 && py <= l.box.y1 + 3) return l.node;
  }
  const p = toWorld(px, py);
  let best = null, bd = Infinity;
  for (const n of nodes) {
    const d = Math.hypot(n.x - p.x, n.y - p.y);
    // generous screen-space radius so small dots stay clickable when zoomed out
    if (d < Math.max(n.r + 3, 11 / view.k) && d < bd) { best = n; bd = d; }
  }
  return best;
}
let panning = false, moved = false, last = null;
const tip = document.getElementById('tip');
canvas.addEventListener('pointerdown', e => {
  last = { x: e.clientX, y: e.clientY }; moved = false;
  dragNode = hit(e.clientX, e.clientY);
  panning = !dragNode;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (last && (dragNode || panning)) {
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (dragNode) {
      const p = toWorld(e.clientX, e.clientY);
      dragNode.x = p.x; dragNode.y = p.y; wake(30);
    } else { view.x += dx; view.y += dy; }
    last = { x: e.clientX, y: e.clientY };
    draw(); return;
  }
  const h = hit(e.clientX, e.clientY);
  if (h !== hovered) { hovered = h; canvas.style.cursor = h ? 'pointer' : ''; draw(); }
  if (h) {
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 330) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
    tip.innerHTML = `${esc(h.statement)}<div class="d">${esc(h.domain)} · ${
      esc(h.type)} · ${h.deg} link${h.deg === 1 ? '' : 's'}</div>`;
  } else tip.style.display = 'none';
});
canvas.addEventListener('pointerup', e => {
  canvas.classList.remove('dragging');
  // A canvas click keeps your own framing; only panel navigation re-frames.
  if (!moved) { select(hit(e.clientX, e.clientY), { focus: false }); }
  dragNode = null; panning = false; last = null;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * .0015);
  const k2 = Math.min(6, Math.max(.25, view.k * f)), r = k2 / view.k;
  view.x = e.clientX - (e.clientX - view.x) * r;
  view.y = e.clientY - (e.clientY - view.y) * r;
  view.k = k2; draw();
}, { passive: false });

const esc = s => s.replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// The papers an idea came from: PubMed records link out by PMID, locally
// ingested documents link to their page in the vault beside this file.
function papersSection(n) {
  const cites = n.cites || [];
  if (!cites.length) return '';
  const rows = cites.map(c => {
    const meta = (DATA.paperMeta || {})[c.id] || {};
    const title = esc(meta.title || c.id);
    const sub = [meta.journal, meta.year].filter(Boolean).map(esc).join(' · ');
    const href = meta.local
      ? `papers/${encodeURIComponent(c.id)}/paper.md`
      : `https://pubmed.ncbi.nlm.nih.gov/${encodeURIComponent(c.id)}/`;
    return `<a class="rel paper" href="${href}"${meta.local ? '' :
      ' target="_blank" rel="noopener"'}>
      <span class="kind">${esc(c.relation)}${meta.local ? ' · local file'
        : ' · PMID ' + esc(c.id)}</span><br>${title}
      ${sub ? `<span class="sub">${sub}</span>` : ''}</a>`;
  }).join('');
  return `<h3>${cites.length} source paper${cites.length === 1 ? '' : 's'}</h3>${rows}`;
}

// Nearest ideas by embedding, whether or not the graph links them — this one
// needs no endpoint, since both vectors are already in the page.
function similarSection(n) {
  if (!VEC) return '';
  const i = nodes.indexOf(n);
  const { dims, buf } = VEC;
  const q = new Float32Array(dims);
  for (let d = 0; d < dims; d++) q[d] = buf[i * dims + d] / 127;
  const near = [...scoreAgainst(q)]
    .filter(([m]) => m !== n && !neighbors.get(n).has(m))
    .sort((a, b) => b[1] - a[1]).slice(0, 5)
    // Above the typical nearest-neighbour similarity for this model, so the
    // list means "unusually close", not just "closest available".
    .filter(([, s]) => s > .78);
  if (!near.length) return '';
  return `<h3>similar, not linked</h3>` + near.map(([m, s]) =>
    `<button class="rel" data-id="${esc(m.id)}">
       <span class="kind">${s.toFixed(2)} · ${esc(m.domain)}</span><br>
       ${esc(m.statement)}</button>`).join('');
}

function select(n, { focus = true } = {}) {
  const had = panel.classList.contains('open');
  selected = n;
  panel.classList.toggle('open', !!n);
  if (n && focus) focusNode(n);
  else if (had !== panel.classList.contains('open')) fitView();
  if (n) {
    const rels = edges.filter(e => e.a === n || e.b === n).map(e => {
      const other = e.a === n ? e.b : e.a;
      return `<button class="rel" data-id="${esc(other.id)}">
        <span class="kind">${e.rel}</span><br>${esc(other.statement)}</button>`;
    }).join('');
    document.getElementById('panel-body').innerHTML = `
      <h2>${esc(n.statement)}</h2>
      <div class="meta">
        <span class="tag"><span class="dot"
          style="background:${C.s[slotOf(n.domain)]}"></span>${esc(n.domain)}</span>
        <span class="tag">${esc(n.type)}</span>
        <span class="tag">level ${n.level}</span>
      </div>
      ${papersSection(n)}
      <h3>${n.deg} connected idea${n.deg === 1 ? '' : 's'}</h3>${rels}
      ${similarSection(n)}`;
  }
  draw();
}
panel.addEventListener('click', e => {
  if (e.target.closest('.close')) select(null);
  const b = e.target.closest('button.rel');   // paper links are anchors: let
  if (b) { const n = byId.get(b.dataset.id); if (n) select(n); }  // them navigate
});

// ---- legend ----
const legend = document.getElementById('legend');
const doms = [...TOP];
if (Object.keys(counts).length > 8) doms.push(null);   // "other"
legend.innerHTML = doms.map(d => {
  const n = d ? counts[d]
    : nodes.filter(x => slotOf(x.domain) === 0).length;
  const slot = d ? slotOf(d) : 0;
  return `<button class="chip" data-d="${d ?? ''}">
    <span class="dot" style="background:${C.s[slot]}"></span>
    ${d ? esc(d) : 'other domains'}<span class="n">${n}</span></button>`;
}).join('');
legend.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const d = b.dataset.d || null;
  soloDomain = soloDomain === d || (d === null && soloDomain === '__other__')
    ? null : (d ?? '__other__');
  for (const chip of legend.children) {
    const cd = chip.dataset.d || null;
    const active = soloDomain === cd || (soloDomain === '__other__' && cd === null);
    chip.classList.toggle('solo', active);
    chip.classList.toggle('off', soloDomain !== null && !active);
  }
  draw();
});
const relBtn = document.getElementById('toggle-related');
relBtn.classList.add('off');
relBtn.title = 'Show the loose related_to mesh';
relBtn.addEventListener('click', () => {
  showRelated = !showRelated;
  relBtn.classList.toggle('off', !showRelated);
  draw();
});

const search = document.getElementById('search');
const searchNote = document.getElementById('search-note');
const canEmbed = !!(VEC && DATA.searchModel);
search.placeholder = canEmbed ? 'Search ideas by meaning…' : 'Search ideas…';

function setNote(text, kind) {
  searchNote.textContent = text;
  searchNote.dataset.kind = kind || '';
}

let searchSeq = 0;
async function runSearch(text) {
  const seq = ++searchSeq;
  query = text.trim().toLowerCase();
  if (!query) { semantic = null; setNote(''); draw(); return; }
  if (!canEmbed) {
    semantic = null;
    setNote(`${nodes.filter(visible).length} text matches`);
    draw(); return;
  }
  setNote(embedder ? 'searching…' : 'preparing…', 'busy');
  draw();
  try {
    const qvec = await embedQuery(text.trim(),
      msg => { if (seq === searchSeq) setNote(msg, 'busy'); });
    if (seq !== searchSeq) return;              // a newer keystroke won
    const ranked = [...scoreAgainst(qvec)]
      .sort((a, b) => b[1] - a[1]).slice(0, SEMANTIC_KEEP);
    semantic = new Map(ranked);
    setNote(`${ranked.length} by meaning · best ${ranked[0][1].toFixed(2)} · ${
      embedder.device}`, 'ok');
  } catch (err) {
    if (seq !== searchSeq) return;
    semantic = null;                            // no model → text matching
    setNote(`${nodes.filter(visible).length} text matches (model unavailable)`, 'warn');
  }
  draw();
}

let searchTimer = null;
search.addEventListener('input', e => {
  const text = e.target.value;
  clearTimeout(searchTimer);
  // Debounce: one embedding request per pause, not per keystroke.
  searchTimer = setTimeout(() => runSearch(text), canEmbed ? 350 : 0);
});
// Enter jumps to the best match, so search doubles as navigation.
search.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !search.value.trim()) return;
  clearTimeout(searchTimer);
  runSearch(search.value).then(() => {
    const best = semantic
      ? [...semantic].sort((a, b) => b[1] - a[1])[0]?.[0]
      : nodes.filter(visible).sort((a, b) => b.deg - a.deg)[0];
    if (best) select(best);
  });
});
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });
addEventListener('resize', resize);
resize();
</script>
