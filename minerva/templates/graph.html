<title>__TITLE__</title>
<style>
  :root {
    --surface: #fcfcfb; --panel: #f4f3f0; --ink: #0b0b0b; --ink-2: #52514e;
    --ink-3: #8a887f; --line: #e2e0da; --accent: #4a3aa7;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s0:#9a988e;
    --edge: 226,224,218; --halo: 252,252,251;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #17181a; --panel: #1f2124; --ink: #f2f1ec; --ink-2: #b9b8af;
      --ink-3: #7c7b73; --line: #2e3034; --accent: #9085e9;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#3fa23f; --s7:#9085e9; --s8:#e66767; --s0:#6f6e66;
      --edge: 46,48,52; --halo: 23,24,26;
    }
  }
  :root[data-theme="dark"] {
    --surface: #17181a; --panel: #1f2124; --ink: #f2f1ec; --ink-2: #b9b8af;
    --ink-3: #7c7b73; --line: #2e3034; --accent: #9085e9;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#3fa23f; --s7:#9085e9; --s8:#e66767; --s0:#6f6e66;
    --edge: 46,48,52; --halo: 23,24,26;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--surface); color: var(--ink); overflow: hidden;
    font: 14px/1.45 system-ui, sans-serif;
  }
  #canvas { position: fixed; inset: 0; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  .hud { position: fixed; z-index: 3; }
  #header { top: 0; left: 0; right: 0; padding: 14px 20px 28px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    background: linear-gradient(rgb(var(--halo)) 30%, rgba(var(--halo),0));
    pointer-events: none; }
  #header > * { pointer-events: auto; }
  h1 { font: 600 21px/1.2 "Iowan Old Style", Georgia, "Times New Roman", serif;
    letter-spacing: .01em; text-wrap: balance; }
  #stats { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  #stats b { color: var(--ink); font-weight: 600; }
  #search { margin-left: auto; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px;
    width: min(300px, 70vw); font: inherit; }
  #search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #legend { left: 16px; bottom: 14px; display: flex; flex-direction: column;
    gap: 4px; max-width: 250px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    border: 1px solid transparent; border-radius: 999px; cursor: pointer;
    background: none; color: var(--ink-2); font: 12.5px system-ui, sans-serif;
    text-align: left; }
  .chip:hover { background: var(--panel); }
  .chip:focus-visible { outline: 2px solid var(--accent); }
  .chip.off { opacity: .38; }
  .chip.solo { background: var(--panel); border-color: var(--line); color: var(--ink); }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .chip .n { margin-left: auto; color: var(--ink-3);
    font-variant-numeric: tabular-nums; }
  #edgekey { right: 16px; bottom: 14px; color: var(--ink-3); font-size: 12px;
    display: flex; gap: 16px; align-items: center; }
  #edgekey svg { vertical-align: -3px; }
  #panel { top: 0; right: 0; bottom: 0; width: min(360px, 92vw);
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 20px; overflow-y: auto; transform: translateX(105%);
    transition: transform .22s ease; z-index: 4; }
  @media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
  #panel.open { transform: none; }
  #panel .close { float: right; background: none; border: 0; color: var(--ink-3);
    font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px; }
  #panel .close:hover { color: var(--ink); }
  #panel h2 { font: 600 16px/1.35 system-ui, sans-serif; margin: 4px 0 12px;
    text-wrap: balance; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 6px;
    align-items: center; }
  #panel h3 { font: 600 11px/1 system-ui, sans-serif; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-3); margin: 16px 0 8px; }
  .rel { display: block; width: 100%; text-align: left; background: none;
    border: 0; border-top: 1px solid var(--line); padding: 8px 2px;
    color: var(--ink); cursor: pointer; font: 13px/1.4 system-ui, sans-serif; }
  .rel:hover { color: var(--accent); }
  .rel .kind { color: var(--ink-3); font-size: 11px;
    font-family: ui-monospace, monospace; }
  #tip { position: fixed; z-index: 5; pointer-events: none; max-width: 320px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 1.4;
    box-shadow: 0 4px 18px rgba(0,0,0,.18); display: none; }
  #tip .d { color: var(--ink-3); font-size: 11px; margin-top: 3px; }
</style>

<canvas id="canvas"></canvas>

<div class="hud" id="header">
  <h1>__TITLE__</h1>
  <span id="stats"></span>
  <input id="search" type="search" placeholder="Search ideas…"
         aria-label="Search idea statements">
</div>

<div class="hud" id="legend" role="group" aria-label="Domains — click to isolate"></div>

<div class="hud" id="edgekey">
  <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3"
    stroke="currentColor" stroke-width="1.6"/></svg> part_of</span>
  <span style="opacity:.55"><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3"
    stroke="currentColor" stroke-width="1"/></svg> related_to</span>
  <span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3"
    stroke="currentColor" stroke-width="1.8" stroke-dasharray="4 3"/></svg> analogous_to</span>
</div>

<aside id="panel" aria-label="Idea details">
  <button class="close" aria-label="Close details">×</button>
  <div id="panel-body"></div>
</aside>

<div id="tip" role="status"></div>

<script>
const DATA = __DATA__;

// ---- domain → color slot (fixed order by size; the rest fold to "other") ----
const counts = {};
DATA.nodes.forEach(n => counts[n.domain] = (counts[n.domain] || 0) + 1);
const TOP = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8)
  .map(e => e[0]);
const slotOf = d => { const i = TOP.indexOf(d); return i < 0 ? 0 : i + 1; };

const css = name => getComputedStyle(document.documentElement)
  .getPropertyValue(name).trim();
let C = {};
function readTheme() {
  C = { surface: css('--surface'), ink: css('--ink'), ink2: css('--ink-2'),
        ink3: css('--ink-3'), edge: css('--edge'), accent: css('--accent'),
        s: [css('--s0'), css('--s1'), css('--s2'), css('--s3'), css('--s4'),
            css('--s5'), css('--s6'), css('--s7'), css('--s8')] };
}
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  readTheme(); draw();
});

// ---- graph model ----
const nodes = DATA.nodes.map(n => ({ ...n, x: 0, y: 0, vx: 0, vy: 0, deg: 0 }));
const byId = new Map(nodes.map(n => [n.id, n]));
const seen = new Set();
const edges = [];
for (const e of DATA.edges) {
  const a = byId.get(e.source), b = byId.get(e.target);
  if (!a || !b) continue;
  const key = [e.source, e.target].sort().join('|');   // mirrored edges: keep one,
  if (seen.has(key) && e.rel === 'related_to') continue; // prefer the typed one
  if (!seen.has(key)) { a.deg++; b.deg++; }
  seen.add(key);
  edges.push({ a, b, rel: e.rel });
}
nodes.forEach(n => {
  n.r = 3.5 + Math.sqrt(n.deg) * 1.6 + (n.papers > 1 ? 2 : 0);
  const gold = Math.random() * Math.PI * 2, rad = 90 + Math.random() * 320;
  n.x = Math.cos(gold) * rad; n.y = Math.sin(gold) * rad;
});
document.getElementById('stats').innerHTML =
  `<b>${nodes.length}</b> ideas · <b>${edges.length}</b> links · ${DATA.papers} papers`;

// ---- force simulation ----
// Declared here, not with the other pointer state below: tick() reads it and
// runs during warm-up, before that block would be initialized.
let dragNode = null;
function tick(alpha) {
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const m = nodes[j];
      let dx = n.x - m.x, dy = n.y - m.y;
      let d2 = dx * dx + dy * dy;
      if (d2 > 90000) continue;
      if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const f = alpha * 900 / d2;
      dx *= f; dy *= f;
      n.vx += dx; n.vy += dy; m.vx -= dx; m.vy -= dy;
    }
  }
  for (const e of edges) {
    const k = e.rel === 'part_of' ? .06 : e.rel === 'analogous_to' ? .03 : .015;
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
    const d = Math.hypot(dx, dy) || 1, f = alpha * k * (d - 60) / d;
    e.a.vx += dx * f; e.a.vy += dy * f;
    e.b.vx -= dx * f; e.b.vy -= dy * f;
  }
  for (const n of nodes) {
    n.vx -= n.x * alpha * .012; n.vy -= n.y * alpha * .012;  // center gravity
    if (n !== dragNode) { n.x += n.vx; n.y += n.vy; }
    n.vx *= .6; n.vy *= .6;
  }
}
for (let i = 0; i < 250; i++) tick(1 - i / 300);   // warm-up before first paint

// ---- rendering ----
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let view = { x: 0, y: 0, k: 1 }, dpr = 1;
function resize() {
  dpr = devicePixelRatio || 1;
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  view.x = innerWidth / 2; view.y = innerHeight / 2;
  const fit = Math.min(innerWidth, innerHeight);
  view.k = Math.max(.5, fit / 1050);
  draw();
}
let selected = null, hovered = null, soloDomain = null, query = '';
const visible = n => {
  const domOK = !soloDomain ||
    (soloDomain === '__other__' ? slotOf(n.domain) === 0 : n.domain === soloDomain);
  return domOK && (!query || n.statement.toLowerCase().includes(query));
};
function emphasis(n) {
  if (!visible(n)) return .12;
  if (selected) {
    if (n === selected) return 1;
    return neighbors.get(selected).has(n) ? .95 : .15;
  }
  return query || soloDomain ? 1 : .9;
}
const neighbors = new Map(nodes.map(n => [n, new Set()]));
edges.forEach(e => { neighbors.get(e.a).add(e.b); neighbors.get(e.b).add(e.a); });

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.translate(view.x, view.y); ctx.scale(view.k, view.k);
  for (const e of edges) {
    const em = Math.min(emphasis(e.a), emphasis(e.b));
    const strong = selected && (e.a === selected || e.b === selected);
    let alpha = e.rel === 'related_to' ? .35 : .6;
    alpha *= em; if (strong) alpha = .95;
    ctx.strokeStyle = strong ? C.accent : `rgba(${C.edge},${alpha + .25})`;
    ctx.globalAlpha = strong ? .9 : Math.max(.06, em * .8);
    ctx.lineWidth = (e.rel === 'related_to' ? .7 : 1.3) / view.k +
      (strong ? .8 / view.k : 0);
    ctx.setLineDash(e.rel === 'analogous_to' ? [5 / view.k, 4 / view.k] : []);
    ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const n of nodes) {
    const em = emphasis(n);
    ctx.globalAlpha = em;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7);
    ctx.fillStyle = C.s[slotOf(n.domain)];
    ctx.fill();
    if (n === selected || n === hovered) {
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6 / view.k; ctx.stroke();
    } else {
      ctx.strokeStyle = C.surface; ctx.lineWidth = 1 / view.k; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.font = `${11 / view.k}px system-ui, sans-serif`;
  ctx.fillStyle = C.ink2;
  const labeled = [...nodes].sort((a, b) => b.deg - a.deg).slice(0, 14);
  for (const n of labeled) {
    if (emphasis(n) < .5) continue;
    ctx.fillText(n.statement.slice(0, 42) + (n.statement.length > 42 ? '…' : ''),
      n.x + n.r + 4 / view.k, n.y + 3 / view.k);
  }
}

let running = 120;
(function loop() {
  if (running > 0) { tick(Math.min(.4, running / 300)); running--; draw(); }
  requestAnimationFrame(loop);
})();
const wake = n => { running = Math.max(running, n); };

// ---- interaction ----
const toWorld = (px, py) =>
  ({ x: (px - view.x) / view.k, y: (py - view.y) / view.k });
function hit(px, py) {
  const p = toWorld(px, py);
  let best = null, bd = Infinity;
  for (const n of nodes) {
    const d = Math.hypot(n.x - p.x, n.y - p.y);
    if (d < Math.max(n.r + 3, 8 / view.k) && d < bd) { best = n; bd = d; }
  }
  return best;
}
let panning = false, moved = false, last = null;
const tip = document.getElementById('tip');
canvas.addEventListener('pointerdown', e => {
  last = { x: e.clientX, y: e.clientY }; moved = false;
  dragNode = hit(e.clientX, e.clientY);
  panning = !dragNode;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (last && (dragNode || panning)) {
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (dragNode) {
      const p = toWorld(e.clientX, e.clientY);
      dragNode.x = p.x; dragNode.y = p.y; wake(30);
    } else { view.x += dx; view.y += dy; }
    last = { x: e.clientX, y: e.clientY };
    draw(); return;
  }
  const h = hit(e.clientX, e.clientY);
  if (h !== hovered) { hovered = h; draw(); }
  if (h) {
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 330) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
    tip.innerHTML = `${esc(h.statement)}<div class="d">${esc(h.domain)} · ${
      esc(h.type)} · ${h.deg} link${h.deg === 1 ? '' : 's'}</div>`;
  } else tip.style.display = 'none';
});
canvas.addEventListener('pointerup', e => {
  canvas.classList.remove('dragging');
  if (!moved) { select(hit(e.clientX, e.clientY)); }
  dragNode = null; panning = false; last = null;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * .0015);
  const k2 = Math.min(6, Math.max(.25, view.k * f)), r = k2 / view.k;
  view.x = e.clientX - (e.clientX - view.x) * r;
  view.y = e.clientY - (e.clientY - view.y) * r;
  view.k = k2; draw();
}, { passive: false });

const esc = s => s.replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const panel = document.getElementById('panel');
function select(n) {
  selected = n;
  panel.classList.toggle('open', !!n);
  if (n) {
    const rels = edges.filter(e => e.a === n || e.b === n).map(e => {
      const other = e.a === n ? e.b : e.a;
      return `<button class="rel" data-id="${esc(other.id)}">
        <span class="kind">${e.rel}</span><br>${esc(other.statement)}</button>`;
    }).join('');
    document.getElementById('panel-body').innerHTML = `
      <h2>${esc(n.statement)}</h2>
      <div class="meta">
        <span class="tag"><span class="dot"
          style="background:${C.s[slotOf(n.domain)]}"></span>${esc(n.domain)}</span>
        <span class="tag">${esc(n.type)}</span>
        <span class="tag">level ${n.level}</span>
        <span class="tag">${n.papers} paper${n.papers === 1 ? '' : 's'}</span>
      </div>
      <h3>${n.deg} connected idea${n.deg === 1 ? '' : 's'}</h3>${rels}`;
  }
  draw();
}
panel.addEventListener('click', e => {
  if (e.target.closest('.close')) select(null);
  const b = e.target.closest('.rel');
  if (b) { const n = byId.get(b.dataset.id); if (n) select(n); }
});

// ---- legend ----
const legend = document.getElementById('legend');
const doms = [...TOP];
if (Object.keys(counts).length > 8) doms.push(null);   // "other"
legend.innerHTML = doms.map(d => {
  const n = d ? counts[d]
    : nodes.filter(x => slotOf(x.domain) === 0).length;
  const slot = d ? slotOf(d) : 0;
  return `<button class="chip" data-d="${d ?? ''}">
    <span class="dot" style="background:${C.s[slot]}"></span>
    ${d ? esc(d) : 'other domains'}<span class="n">${n}</span></button>`;
}).join('');
legend.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const d = b.dataset.d || null;
  soloDomain = soloDomain === d || (d === null && soloDomain === '__other__')
    ? null : (d ?? '__other__');
  for (const chip of legend.children) {
    const cd = chip.dataset.d || null;
    const active = soloDomain === cd || (soloDomain === '__other__' && cd === null);
    chip.classList.toggle('solo', active);
    chip.classList.toggle('off', soloDomain !== null && !active);
  }
  draw();
});
document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase(); draw();
});
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });
addEventListener('resize', resize);
resize();
</script>
